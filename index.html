   m=L.circleMarker([s.lat,s.lng],{radius:6,color:'#fff',weight:1.5,fillColor:g.color,fillOpacity:.95});
  }
  const hubtag=s.hub?' <span class="tag" style="background:#333">🅷 HUB'+(s.chargers?' '+s.chargers+' หัว':'')+'</span>':'';
  const html='<div class="pp"><b>'+s.name+'</b><br><span class="tag" style="background:'+g.color+'">'+g.label+'</span>'+hubtag+
    '<br>🔌 '+(s.conn||'-')+(s.chargers?' · <b>'+s.chargers+' chargers</b>':'')+(s.outlets?' · '+s.outlets+' หัว CCS2':'')+
    ((s.district||s.province)?'<br>📍 '+[s.district,s.province].filter(Boolean).join(' · '):'')+
    distListHtml(s.pd,s.pa,null)+
    '<a href="https://www.google.com/maps/search/?api=1&query='+s.lat+','+s.lng+'" target="_blank">เปิดใน Google Maps ↗</a></div>';
  m.bindPopup(html);
  grp.addLayer(m);});
 if(g.on){grp.addTo(map);}
 overlays[g.label+' ('+list.length+' จุด)']=grp;
 const el=document.getElementById('c'+(g.key==='PEA VOLTA'?'PEA':g.key)); if(el){el.textContent='('+list.length+' จุด)';}
});
let poiBounds=null;
if(D.poi&&D.poi.length){
 const pg=L.layerGroup();
 D.poi.forEach(function(p,i){
  L.marker([p.lat,p.lng],{icon:L.divIcon({html:'<div class="poipin">'+poiIcon(p)+'</div>',className:'',iconSize:[26,26],iconAnchor:[13,13]}),zIndexOffset:1000})
   .bindTooltip(p.name,{permanent:true,direction:'top',offset:[0,-14],className:'poilabel'})
   .bindPopup('<div class="pp"><b>'+poiIcon(p)+' '+p.name+'</b>'+
     distListHtml(D.poiDist&&D.poiDist[i],D.poiApprox&&D.poiApprox[i],i)+
     '<a href="https://www.google.com/maps/dir/?api=1&destination='+p.lat+','+p.lng+'&travelmode=driving" target="_blank">🧭 นำทางไปที่นี่ ↗</a></div>')
   .addTo(pg);
 });
 pg.addTo(map);
 overlays['📍 สถานที่น่าสนใจ ('+D.poi.length+' ที่)']=pg;
 poiBounds=L.latLngBounds(D.poi.map(function(p){return [p.lat,p.lng];}));
}
const lc=L.control.layers(null,overlays,{collapsed:false}).addTo(map);
(function(){
 const el=lc.getContainer();
 el.style.position='relative'; el.style.paddingTop='20px';
 const x=document.createElement('span'); x.className='boxclose'; x.textContent='×'; x.title='ปิด';
 x.style.top='2px'; x.style.right='7px'; el.appendChild(x);
 const reopen=document.createElement('div');
 reopen.innerHTML='☰ ชั้นข้อมูล'; reopen.title='เปิดรายการชั้นข้อมูล';
 reopen.style.cssText='display:none;position:absolute;top:10px;right:10px;z-index:1000;background:#fff;padding:6px 10px;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.3);cursor:pointer;font-size:12px;font-weight:600';
 document.body.appendChild(reopen);
 x.onclick=function(){el.style.display='none';reopen.style.display='block';};
 reopen.onclick=function(){el.style.display='';reopen.style.display='none';};
})();
function fit(){try{map.invalidateSize();if(poiBounds)map.fitBounds(poiBounds.pad(0.6),{maxZoom:11,animate:false});}catch(e){}}
window.addEventListener('load',function(){setTimeout(fit,200)});setTimeout(fit,400);
